name: CI

on:
  push:
  pull_request:

jobs:
  extension:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:checksum
      - run: npm run verify:package

  simulator-source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m compileall -q "HSL Debugger/hsl_runtime"
      - run: python -m unittest discover -s "HSL Debugger/tests" -p "test_*.py"
